name: Deploy vescueye to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: code/mobile-app/Backend  # sets context for all run commands here

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Recreate .env file from GitHub Secret
        run: echo "${{ secrets.MOBILE_SECRETS }}" > .env

      - name: Create ecosystem.config.js
        run: |
          cat > ecosystem.config.js << EOF
          module.exports = {
            apps: [{
              name: "vescueye",
              script: "server.js",
              instances: "max",
              exec_mode: "cluster",
              env_production: {
                NODE_ENV: "production",
                PORT: 5001
              }
            }]
          }
          EOF

      - name: Start or reload app with PM2
        run: pm2 startOrReload ecosystem.config.js --env production
