name: Deploy to EC2
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        cd code/mobile-app/Backend
        npm ci
    
    - name: Stop existing app
      run: |
        sudo pkill -f "node.*server.js" || true
        sudo lsof -ti:5001 | sudo xargs kill -9 || true
        sleep 3
    
    - name: Start application
      run: |
        cd code/mobile-app/Backend
        nohup npm start > app.log 2>&1 &
        echo $! > app.pid
        sleep 10
    
    - name: Health check
      run: |
        cd code/mobile-app/Backend
        if [ -f app.pid ] && ps -p $(cat app.pid) > /dev/null; then
          echo "✅ Application started successfully"
          if nc -z localhost 5001; then
            echo "✅ Port 5001 is accessible"
          else
            echo "⚠️  Port check failed but app is running"
          fi
        else
          echo "❌ Application failed to start"
          cat app.log
          exit 1
        fi
