name: Deploy to EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Navigate to backend directory
      run: cd code/mobile-app/Backend
      
    - name: Install dependencies
      run: |
        cd code/mobile-app/Backend
        npm ci
    
    - name: Run tests (if you have tests)
      run: |
        cd code/mobile-app/Backend
        npm test || echo "No tests to run"
      continue-on-error: true
    
    - name: Build application (if you have a build step)
      run: |
        cd code/mobile-app/Backend
        npm run build || echo "No build step required"
      continue-on-error: true
    
    - name: Stop existing application
      run: |
        cd code/mobile-app/Backend
        pm2 stop Vescueye || true
        pm2 delete Vescueye || true
    
    - name: Start application
      run: |
        cd code/mobile-app/Backend
        mkdir -p logs
        pm2 start ecosystem.config.js
        pm2 save
        
    - name: Wait for application to start
      run: sleep 10
    
    - name: Health check
      run: |
        cd code/mobile-app/Backend
        # Check if PM2 process is running
        pm2 status | grep Vescueye || (echo "PM2 process not running" && exit 1)
        
        # Check if the port is accessible
        curl -f http://localhost:3000/health || curl -f http://localhost:3000 || (echo "Health check failed" && exit 1)
