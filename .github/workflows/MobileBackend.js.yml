name: Deploy to EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Navigate to backend directory
      run: cd code/mobile-app/Backend
      
    - name: Install dependencies
      run: |
        cd code/mobile-app/Backend
        npm ci
    
    - name: Run tests (if you have tests)
      run: |
        cd code/mobile-app/Backend
        npm test || echo "No tests to run"
      continue-on-error: true
    
    - name: Build application (if you have a build step)
      run: |
        cd code/mobile-app/Backend
        npm run build || echo "No build step required"
      continue-on-error: true
    
    - name: Stop existing application
      run: |
        # Kill any existing node processes
        sudo pkill -f "node.*server" || true
        sudo pkill -f "npm.*start" || true
        # Wait for processes to stop
        sleep 2
    
    - name: Start application
      run: |
        cd code/mobile-app/Backend
        # Start the application in the background
        nohup npm start > app.log 2>&1 &
        echo $! > app.pid
        
    - name: Wait for application to start
      run: sleep 10
    
    - name: Health check
      run: |
        cd code/mobile-app/Backend
        # Check if process is still running
        if [ -f app.pid ]; then
          PID=$(cat app.pid)
          if ps -p $PID > /dev/null; then
            echo "Application is running with PID: $PID"
          else
            echo "Application process not found"
            cat app.log
            exit 1
          fi
        else
          echo "PID file not found"
          exit 1
        fi
        
        # Check if the port is accessible
        for i in {1..5}; do
          if curl -f http://localhost:3000/health || curl -f http://localhost:3000; then
            echo "Health check passed"
            exit 0
          fi
          echo "Health check attempt $i failed, retrying..."
          sleep 2
        done
        
        echo "Health check failed after 5 attempts - check app.log for errors"
        cat app.log
        exit 1
